<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz · Proyección</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#2A1070;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1a0a5e;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-size:16px;font-weight:900;color:#fff}
.hint{font-size:11px;color:#8a7aaa}
.phase-badge{font-size:11px;font-weight:700;color:#c4adff;background:rgba(107,43,217,.4);padding:3px 10px;border-radius:10px}
#main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.big-prompt{font-size:clamp(22px,3.5vw,40px);font-weight:900;color:#fff;text-align:center;line-height:1.3;max-width:800px;margin-bottom:24px}
.type-tag{font-size:14px;font-weight:700;color:#c4adff;background:rgba(255,255,255,.1);padding:6px 18px;border-radius:20px;margin-bottom:20px;display:inline-block}
.timer-ring{font-size:72px;font-weight:900;color:#e8192c;text-align:center}
.opts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;width:100%;max-width:700px}
.opt-box{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:16px;padding:20px;font-size:18px;font-weight:700;color:#fff;text-align:center}
.opt-box.correct{background:rgba(22,163,74,.3);border-color:#16a34a}
.count-badge{font-size:24px;font-weight:900;color:#c4adff;text-align:center}
.players-arena{width:100%;max-width:800px;height:350px;position:relative;overflow:hidden;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.player-node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.pem{font-size:36px}
.pnm{font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:10px;white-space:nowrap}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;width:100%;max-width:700px}
.bar-label{color:#fff;font-size:16px;font-weight:700;width:140px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-bg{flex:1;height:48px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden}
.bar-fill{height:100%;background:#6b2bd9;border-radius:10px;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-size:18px;font-weight:900;color:#fff;transition:width .5s ease;min-width:48px}
.bar-fill.correct{background:#16a34a}
.rank-table{width:100%;max-width:600px}
.rank-row{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.rpos{font-size:20px;font-weight:900;color:#c4adff;width:32px}
.rname{flex:1;font-size:18px;font-weight:700;color:#fff}
.rpts{font-size:18px;font-weight:900;color:#c4adff}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">✈ Quiz Producto</div>
  <div id="phaseBadge" class="phase-badge">Lobby</div>
  <div class="hint">→ / Espacio = siguiente · F11 = pantalla completa</div>
</div>
<div id="main"><div style="color:#c4adff;font-size:16px">Conectando...</div></div>
<script>
const BASE=location.pathname.split('/').slice(0,2).join('/');
const WS_URL=(location.protocol==='https:'?'wss':'ws')+'://'+location.host+BASE+'/ws';
let ws,timerInterval,nodes=[];
let prevRankings=[];
function connect(){ws=new WebSocket(WS_URL);ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=()=>setTimeout(connect,2000);}
function handle(msg){
  if(msg.type==='LOBBY_UPDATE')renderLobby(msg.players);
  else if(msg.type==='PHASE_READING')renderReading(msg);
  else if(msg.type==='PHASE_ANSWERING')renderAnswering(msg);
  else if(msg.type==='PHASE_QUESTION_RESULTS')renderResults(msg);
  else if(msg.type==='PHASE_WAITING')renderWaiting(msg.players);
  else if(msg.type==='PHASE_FINISHED')renderFinished(msg);
  else if(msg.type==='ANSWER_COUNT')updateAnswerCount(msg);
}
function setPhase(p){document.getElementById('phaseBadge').textContent=p;}
function main(html){clearInterval(timerInterval);document.getElementById('main').innerHTML=html;}
function renderLobby(players){
  setPhase('Lobby');
  nodes=players.map(p=>({name:p.name,emoji:p.emoji,x:30+Math.random()*680,y:30+Math.random()*280,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100}));
  main(`<div class="players-arena" id="arena"></div><div class="count-badge" style="margin-top:16px">${players.length} jugador${players.length!==1?'es':''} en la sala</div>`);
  requestAnimationFrame(anim);
}
let lastT=0;
function anim(t){
  if(!document.getElementById('arena'))return;
  const dt=Math.min((t-lastT)/1000,.05);lastT=t;
  const arena=document.getElementById('arena');if(!arena)return;
  const W=arena.offsetWidth-56,H=arena.offsetHeight-56;
  nodes.forEach(n=>{
    n.x+=n.vx*dt;n.y+=n.vy*dt;
    if(n.x<0){n.x=0;n.vx=Math.abs(n.vx);}if(n.x>W){n.x=W;n.vx=-Math.abs(n.vx);}
    if(n.y<0){n.y=0;n.vy=Math.abs(n.vy);}if(n.y>H){n.y=H;n.vy=-Math.abs(n.vy);}
  });
  arena.innerHTML=nodes.map(n=>`<div class="player-node" style="left:${n.x}px;top:${n.y}px"><div class="pem">${n.emoji}</div><div class="pnm">${n.name}</div></div>`).join('');
  requestAnimationFrame(anim);
}
const TYPE_LABELS={multiple_choice:'Opción múltiple',true_false:'Verdadero / Falso',rank:'Ordenar opciones',estimation:'Estimación numérica',majority:'La mayoría manda'};
function renderReading(msg){
  setPhase(`Pregunta ${msg.questionIndex+1}/${msg.total} · Leyendo`);
  let cdNum=3;
  main(`<div style="text-align:center"><div class="timer-ring" id="cdNum" style="font-size:120px;color:#c4adff">3</div><div style="color:#c4adff;font-size:20px;margin-top:8px">Pregunta siguiente...</div></div>`);
  const cdInterval=setInterval(()=>{
    cdNum--;
    if(cdNum<=0){
      clearInterval(cdInterval);
      let left=Math.max(msg.duration-3,2);
      main((msg.question.imageUrl?`<img src="${msg.question.imageUrl}" style="max-height:200px;border-radius:12px;margin-bottom:20px">`:'')+`<div class="type-tag">${TYPE_LABELS[msg.question.type]}</div><div class="big-prompt">${msg.question.prompt}</div><div class="timer-ring" id="tNum">${left}</div>`);
      timerInterval=setInterval(()=>{left--;const el=document.getElementById('tNum');if(el)el.textContent=left;if(left<=0)clearInterval(timerInterval);},1000);
    } else {
      const el=document.getElementById('cdNum');if(el)el.textContent=cdNum;
    }
  },1000);
}
function renderAnswering(msg){
  setPhase(`Pregunta ${msg.questionIndex+1}/${msg.total} · Respondiendo`);
  let left=msg.question.timeLimit;
  const q=msg.question;
  let optsHTML='';
  if(q.type==='multiple_choice'||q.type==='majority'||q.type==='rank')optsHTML=`<div class="opts-grid">`+(q.options||[]).map(o=>`<div class="opt-box">${o}</div>`).join('')+`</div>`;
  else if(q.type==='true_false')optsHTML=`<div class="opts-grid"><div class="opt-box">✅ Verdadero</div><div class="opt-box">❌ Falso</div></div>`;
  else if(q.type==='estimation')optsHTML=`<div style="color:#c4adff;font-size:18px">Cada jugador escribe su número</div>`;
  main((q.imageUrl?`<img src="${q.imageUrl}" style="max-height:160px;border-radius:12px;margin-bottom:20px">`:'')+`<div class="big-prompt" style="font-size:clamp(18px,2.5vw,30px)">${q.prompt}</div>`+optsHTML+`<div class="timer-ring" id="tNum">${left}</div><div id="answerCount" style="color:#c4adff;font-size:18px;margin-top:12px">0 respondieron</div>`);
  timerInterval=setInterval(()=>{left--;const el=document.getElementById('tNum');if(el){el.textContent=left;if(left<=5)el.style.color='#ff6b6b';}if(left<=0)clearInterval(timerInterval);},1000);
}
function updateAnswerCount(msg){const el=document.getElementById('answerCount');if(el)el.textContent=`${msg.answered}/${msg.total} respondieron`;}
function animateCount(el,from,to,duration){
  const start=performance.now();
  function step(now){const p=Math.min((now-start)/duration,1);el.textContent=Math.round(from+(to-from)*p)+' pts';if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}
function buildEstimationChart(values,realValue){
  const vals=(values||[]).filter(v=>!isNaN(v));
  const real=realValue||0;
  if(!vals.length)return `<div class="big-prompt" style="font-size:22px;margin-bottom:16px">Valor real: <span style="color:#e8192c">${real.toLocaleString()}</span></div><div style="color:#c4adff;font-size:16px;margin-bottom:20px">Sin respuestas</div>`;
  const all=vals.concat([real]);
  let lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  if(lo===hi){lo=lo-1;hi=hi+1;}
  const BUCKETS=Math.min(12,Math.max(5,vals.length));
  const span=(hi-lo)/BUCKETS;
  const counts=new Array(BUCKETS).fill(0);
  vals.forEach(v=>{let b=Math.floor((v-lo)/span);if(b>=BUCKETS)b=BUCKETS-1;if(b<0)b=0;counts[b]++;});
  let realBucket=Math.floor((real-lo)/span);if(realBucket>=BUCKETS)realBucket=BUCKETS-1;if(realBucket<0)realBucket=0;
  const maxC=Math.max.apply(null,counts.concat([1]));
  const bars=counts.map((c,i)=>{
    const h=Math.round(c/maxC*160);
    const isReal=i===realBucket;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px">`+
      `<div style="font-size:13px;font-weight:900;color:#fff;height:16px">${c||''}</div>`+
      `<div style="width:100%;max-width:46px;height:${Math.max(h,c?6:0)}px;border-radius:6px 6px 0 0;background:${isReal?'#e8192c':'#6b2bd9'}"></div>`+
    `</div>`;
  }).join('');
  return `<div style="width:100%;max-width:640px;margin-bottom:12px">`+
      `<div style="display:flex;align-items:flex-end;gap:6px;height:190px;padding:0 4px">${bars}</div>`+
      `<div style="display:flex;justify-content:space-between;color:#8a7aaa;font-size:12px;margin-top:6px;padding:0 4px"><span>${lo.toLocaleString()}</span><span>${hi.toLocaleString()}</span></div>`+
    `</div>`+
    `<div class="big-prompt" style="font-size:22px;margin-bottom:16px">Valor real: <span style="color:#e8192c">${real.toLocaleString()}</span> · ${vals.length} respuesta${vals.length!==1?'s':''}</div>`;
}
function renderResults(msg){
  setPhase('Resultados');
  const d=msg.distribution,correct=msg.correctAnswer;
  const rankings=msg.rankings||[];
  const prevMap={};prevRankings.forEach((r,i)=>{prevMap[r.name]={pos:i+1,pts:r.total_points};});
  let distHTML='';
  if(msg.questionType==='estimation'){
    distHTML=buildEstimationChart(d.values,d.realValue);
  } else if(d.counts&&d.options){
    // Resolver el conteo por opción de forma robusta: los counts pueden venir
    // con clave = texto de la opción, o con clave = ID/índice (0- o 1-based).
    const has=k=>d.counts[k]!=null;
    const mode=d.options.some(o=>has(o))?'text':(has(0)?'idx0':'idx1');
    const cntFor=(o,i)=>mode==='text'?(d.counts[o]||0):mode==='idx0'?(d.counts[i]||0):(d.counts[i+1]||0);
    const counts=d.options.map((o,i)=>cntFor(o,i));
    const total=counts.reduce((a,b)=>a+b,0)||1;
    distHTML=`<div style="width:100%;max-width:700px;margin-bottom:20px">`+d.options.map((o,i)=>{const cnt=counts[i],pct=Math.round(cnt/total*100),isC=o===correct;return`<div class="bar-row"><div class="bar-label">${o}${isC?' ✓':''}</div><div class="bar-bg"><div class="bar-fill${isC?' correct':''}" style="width:${Math.max(pct,4)}%">${cnt}</div></div></div>`;}).join('')+`</div>`;
  }
  const medals=['🥇','🥈','🥉'];
  const rankHTML=`<div class="rank-table">`+rankings.slice(0,8).map((r,i)=>{
    const prev=prevMap[r.name];
    let arrow='';
    if(prev&&prev.pos!==i+1){const d2=prev.pos-(i+1);arrow=`<span style="margin-left:6px;font-size:14px;color:${d2>0?'#4ade80':'#f87171'};font-weight:900">${d2>0?'↑':'↓'}${Math.abs(d2)}</span>`;}
    const fromPts=prev?prev.pts:0;
    return`<div class="rank-row" style="animation:slideIn .3s ease ${i*0.06}s both"><div class="rpos">${medals[i]||i+1}</div><span style="font-size:24px">${r.emoji}</span><div class="rname">${r.name}${arrow}</div><div class="rpts" id="gpts-${i}" data-from="${fromPts}" data-to="${r.total_points}">${fromPts} pts</div></div>`;
  }).join('')+`</div>`;
  main(distHTML+rankHTML);
  prevRankings=rankings;
  rankings.slice(0,8).forEach((_,i)=>{
    const el=document.getElementById('gpts-'+i);if(!el)return;
    const from=parseInt(el.dataset.from)||0,to=parseInt(el.dataset.to)||0;
    setTimeout(()=>animateCount(el,from,to,1200),i*50+300);
  });
}
function renderWaiting(players){
  setPhase('Esperando...');
  nodes=(players||[]).map(p=>({name:p.name,emoji:p.emoji,x:30+Math.random()*680,y:30+Math.random()*280,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100}));
  main(`<div class="players-arena" id="arena"></div><div class="count-badge" style="margin-top:16px">→ para siguiente pregunta</div>`);
  requestAnimationFrame(anim);
}
function renderFinished(msg){
  setPhase('Final');
  const c=msg.champion;
  const rankings=msg.rankings||[];
  const medals=['🥇','🥈','🥉'];
  const rankHTML=rankings.length?`<div class="rank-table" style="margin-top:8px">`+rankings.slice(0,10).map((r,i)=>`<div class="rank-row" style="animation:slideIn .3s ease ${i*0.06}s both"><div class="rpos">${medals[i]||i+1}</div><span style="font-size:24px">${r.emoji}</span><div class="rname">${r.name}</div><div class="rpts">${r.total_points} pts</div></div>`).join('')+`</div>`:'';
  main(`<div style="text-align:center;margin-bottom:24px"><div style="font-size:72px">🏆</div><div style="font-size:clamp(24px,4vw,48px);font-weight:900;color:#fff;margin:8px 0">¡Campeón del mes!</div><div style="font-size:56px">${c?.emoji||'🎉'}</div><div style="font-size:clamp(20px,3vw,36px);font-weight:900;color:#fff">${c?.name||''}</div><div style="font-size:18px;color:#c4adff;margin-top:6px">${c?.total_points||0} puntos</div></div>`+rankHTML);
}
document.addEventListener('keydown',async e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();await fetch(BASE+'/host/api/sessions/next',{method:'POST',headers:{'Content-Type':'application/json'}});}
});
connect();
</script>
</body></html>

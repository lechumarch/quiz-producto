<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Producto</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F2F0FA;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{font-size:32px;font-weight:900;color:#1a0a5e;margin-bottom:4px;text-align:center}
.sub{font-size:14px;color:#8a7aaa;margin-bottom:40px;text-align:center}
.btn{display:block;width:100%;max-width:320px;padding:18px;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;margin-bottom:12px}
.btn-join{background:#e8192c;color:#fff}
.btn-admin{background:#fff;color:#6b2bd9;border:2px solid #c4adff}
</style>
</head>
<body>
<div class="logo">✈️ Quiz Producto</div>
<div class="sub">Mensual Despegar</div>
<a class="btn btn-join" href="/quiz-producto/join">Unirme al quiz →</a>
<a class="btn btn-admin" href="/quiz-producto/host">Host</a>
</body>
</html>
